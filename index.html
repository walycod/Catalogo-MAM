<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎃 MAM Distribuciones | Especial Halloween</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #241033 0%,
                    #10091a 45%,
                    #070707 100%
                );

            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =====================================================
           TELARAÑAS DECORATIVAS
        ===================================================== */

        body::before {
            content: "🕸️";
            position: fixed;
            top: 5px;
            left: 8px;
            font-size: 90px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            transform: rotate(-15deg);
        }

        body::after {
            content: "🕸️";
            position: fixed;
            top: 0;
            right: 5px;
            font-size: 90px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            transform: rotate(15deg);
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        header {
            position: relative;
            overflow: hidden;

            text-align: center;

            padding:
                35px 20px
                32px;

            background:
                linear-gradient(
                    135deg,
                    #080808,
                    #160b22,
                    #2b0b3d
                );

            border-bottom:
                3px solid #ff7200;

            box-shadow:
                0 5px 30px
                rgba(255, 85, 0, 0.25);

            z-index: 1;
        }


        /* Luna */

        header::before {
            content: "🌕";

            position: absolute;

            top: -20px;
            right: 7%;

            font-size: 90px;

            opacity: 0.12;
        }


        /* Murciélago */

        header::after {
            content: "🦇";

            position: absolute;

            top: 15px;
            left: 7%;

            font-size: 55px;

            opacity: 0.25;

            animation:
                volar 4s ease-in-out infinite;
        }


        @keyframes volar {

            0% {
                transform:
                    translateX(0)
                    rotate(-5deg);
            }

            50% {
                transform:
                    translateX(25px)
                    rotate(5deg);
            }

            100% {
                transform:
                    translateX(0)
                    rotate(-5deg);
            }

        }


        /* =====================================================
           MARCA
        ===================================================== */

        .marca {
            position: relative;
            z-index: 2;

            display: inline-block;

            font-size: 20px;

            font-weight: 900;

            letter-spacing: 5px;

            color: #ff8a00;

            margin-bottom: 10px;

            text-shadow:
                0 0 10px
                rgba(255, 115, 0, 0.6);
        }


        header h1 {

            position: relative;
            z-index: 2;

            font-size:
                clamp(34px, 7vw, 64px);

            font-weight: 1000;

            letter-spacing: 3px;

            color: #ffffff;

            text-shadow:
                0 4px 0 #5c167d,
                0 0 15px #ff7200,
                0 0 35px
                rgba(255, 102, 0, 0.5);

            margin-bottom: 12px;
        }


        header h1 span {
            color: #ff7600;
        }


        header p {

            position: relative;
            z-index: 2;

            font-size:
                clamp(14px, 2vw, 18px);

            color: #ddd;

            letter-spacing: 1px;
        }


        .frase {

            position: relative;
            z-index: 2;

            margin-top: 14px;

            font-size: 14px;

            color: #ff9c3a;

            font-weight: bold;
        }


        /* =====================================================
           DECORACIÓN SUPERIOR
        ===================================================== */

        .decoracion {

            display: flex;

            justify-content:
                center;

            align-items:
                center;

            gap: 25px;

            margin-top: 15px;

            font-size: 24px;
        }


        .decoracion span {

            animation:
                flotar 2.5s ease-in-out infinite;
        }


        .decoracion span:nth-child(2) {
            animation-delay: .4s;
        }

        .decoracion span:nth-child(3) {
            animation-delay: .8s;
        }


        @keyframes flotar {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-7px);
            }

        }


        /* =====================================================
           PESTAÑAS
        ===================================================== */

        .pestanas {

            position: relative;
            z-index: 2;

            display: flex;

            justify-content: center;

            padding:
                22px 15px 12px;
        }


        .pestana {

            border:
                2px solid #ff7200;

            padding:
                13px 30px;

            border-radius:
                30px;

            background:
                linear-gradient(
                    135deg,
                    #ff7200,
                    #ff3d00
                );

            color: #fff;

            font-size: 16px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(255, 94, 0, 0.3);

            transition:
                .25s ease;
        }


        .pestana:hover {

            transform:
                translateY(-3px)
                scale(1.03);

            box-shadow:
                0 8px 25px
                rgba(255, 94, 0, 0.5);
        }


        /* =====================================================
           SEPARADOR
        ===================================================== */

        .separador {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            margin:
                8px auto 25px;

            max-width: 700px;

            color: #ff7200;

            font-size: 14px;

            font-weight: bold;
        }


        .separador::before,
        .separador::after {

            content: "";

            height: 1px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff7200
                );
        }


        .separador::after {

            background:
                linear-gradient(
                    90deg,
                    #ff7200,
                    transparent
                );
        }


        /* =====================================================
           GALERÍA
        ===================================================== */

        .galeria {

            position: relative;
            z-index: 2;

            max-width: 1250px;

            margin:
                0 auto;

            padding:
                10px 20px 60px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 22px;
        }


        /* =====================================================
           PRODUCTO
        ===================================================== */

        .producto {

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f1edf4
                );

            border-radius:
                18px;

            overflow: hidden;

            cursor: pointer;

            border:
                2px solid
                rgba(255, 115, 0, 0.15);

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.45);

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                border-color .3s ease;
        }


        .producto::before {

            content: "🎃";

            position: absolute;

            top: 8px;
            right: 8px;

            font-size: 20px;

            opacity: 0;

            transform:
                scale(.5);

            transition:
                .25s ease;

            z-index: 3;
        }


        .producto:hover {

            transform:
                translateY(-8px)
                scale(1.015);

            border-color:
                #ff7200;

            box-shadow:
                0 12px 30px
                rgba(255, 88, 0, 0.35);
        }


        .producto:hover::before {

            opacity: 1;

            transform:
                scale(1);
        }


        .producto img {

            width: 100%;

            height: 230px;

            display: block;

            object-fit: contain;

            padding: 14px;

            background:
                #ffffff;

            transition:
                transform .3s ease;
        }


        .producto:hover img {

            transform:
                scale(1.04);
        }


        /* =====================================================
           PIE DE PRODUCTO
        ===================================================== */

        .producto-info {

            padding:
                8px 12px 12px;

            text-align: center;

            color: #333;

            font-size: 12px;

            font-weight: bold;
        }


        /* =====================================================
           VISOR
        ===================================================== */

        .visor {

            display: none;

            position: fixed;

            z-index: 9999;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.96);

            align-items:
                center;

            justify-content:
                center;

            backdrop-filter:
                blur(8px);
        }


        .visor img {

            max-width: 88%;

            max-height: 82%;

            object-fit: contain;

            border-radius:
                12px;

            background: white;

            padding: 8px;

            box-shadow:
                0 0 40px
                rgba(255, 102, 0, 0.35);
        }


        /* =====================================================
           CERRAR
        ===================================================== */

        .cerrar {

            position: absolute;

            top: 18px;
            right: 28px;

            color: white;

            font-size: 50px;

            line-height: 1;

            font-weight: bold;

            cursor: pointer;

            z-index: 10001;

            transition:
                .2s ease;
        }


        .cerrar:hover {

            color:
                #ff7200;

            transform:
                rotate(90deg);
        }


        /* =====================================================
           ANTERIOR / SIGUIENTE
        ===================================================== */

        .anterior,
        .siguiente {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            border:
                1px solid
                rgba(255,255,255,.25);

            background:
                rgba(255, 112, 0, .85);

            color: white;

            width: 58px;

            height: 72px;

            font-size: 34px;

            cursor: pointer;

            border-radius:
                14px;

            transition:
                .2s ease;

            z-index: 10001;
        }


        .anterior:hover,
        .siguiente:hover {

            background:
                #ff8a00;

            transform:
                translateY(-50%)
                scale(1.08);
        }


        .anterior {
            left: 20px;
        }


        .siguiente {
            right: 20px;
        }


        /* =====================================================
           NUMERO
        ===================================================== */

        .numero {

            position: absolute;

            bottom: 22px;

            left: 50%;

            transform:
                translateX(-50%);

            color: white;

            background:
                rgba(0, 0, 0, .65);

            border:
                1px solid
                rgba(255, 115, 0, .6);

            padding:
                9px 18px;

            border-radius:
                25px;

            font-size: 14px;

            font-weight: bold;

            z-index: 10001;
        }


        /* =====================================================
           WHATSAPP
        ===================================================== */

        .whatsapp {

            position: fixed;

            right: 20px;

            bottom: 20px;

            width: 58px;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                #25D366;

            color: white;

            text-decoration: none;

            font-size: 28px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.4);

            z-index: 5000;

            transition:
                .25s ease;
        }


        .whatsapp:hover {

            transform:
                scale(1.12);

            box-shadow:
                0 8px 30px
                rgba(37,211,102,.45);
        }


        /* =====================================================
           PIE DE PÁGINA
        ===================================================== */

        footer {

            position: relative;

            z-index: 2;

            text-align: center;

            padding:
                25px 15px 35px;

            border-top:
                1px solid
                rgba(255,115,0,.2);

            background:
                rgba(0,0,0,.35);

            color: #aaa;

            font-size: 13px;
        }


        footer strong {

            color:
                #ff7200;
        }


        footer .calabaza {

            display: block;

            font-size: 28px;

            margin-bottom: 8px;
        }


        /* =====================================================
           RESPONSIVE TABLET
        ===================================================== */

        @media (max-width: 1000px) {

            .galeria {

                grid-template-columns:
                    repeat(3, 1fr);

                gap: 16px;
            }

        }


        /* =====================================================
           RESPONSIVE CELULAR
        ===================================================== */

        @media (max-width: 650px) {

            header {

                padding:
                    28px 15px 25px;
            }


            header h1 {

                font-size: 31px;

                letter-spacing: 1px;
            }


            .marca {

                font-size: 16px;

                letter-spacing: 3px;
            }


            header::after {

                left: 3%;

                font-size: 38px;
            }


            header::before {

                right: 2%;

                font-size: 60px;
            }


            .pestana {

                padding:
                    11px 22px;

                font-size: 14px;
            }


            .galeria {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;

                padding:
                    8px 12px 50px;
            }


            .producto {

                border-radius:
                    13px;
            }


            .producto img {

                height: 175px;

                padding: 8px;
            }


            .producto-info {

                font-size: 10px;
            }


            .anterior,
            .siguiente {

                width: 44px;

                height: 58px;

                font-size: 27px;
            }


            .anterior {
                left: 7px;
            }


            .siguiente {
                right: 7px;
            }


            .cerrar {

                top: 12px;

                right: 17px;

                font-size: 42px;
            }


            .visor img {

                max-width: 84%;

                max-height: 76%;
            }


            .whatsapp {

                width: 52px;

                height: 52px;

                right: 14px;

                bottom: 14px;

                font-size: 25px;
            }

        }


        /* =====================================================
           CELULARES PEQUEÑOS
        ===================================================== */

        @media (max-width: 400px) {

            .galeria {

                gap: 9px;

                padding:
                    5px 8px 45px;
            }


            .producto img {

                height: 145px;
            }


            .decoracion {

                gap: 15px;

                font-size: 20px;
            }


            .frase {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ===================================================== -->

    <header>

        <div class="marca">
            MAM DISTRIBUCIONES
        </div>

        <h1>
            🎃 CATÁLOGO <span>HALLOWEEN</span> 👻
        </h1>

        <p>
            Todos nuestros productos en un solo lugar
        </p>

        <div class="frase">
            🕷️ Especial Halloween · Prepará tu pedido 🕷️
        </div>

        <div class="decoracion">
            <span>🦇</span>
            <span>🎃</span>
            <span>👻</span>
        </div>

    </header>


    <!-- =====================================================
         PESTAÑA
    ===================================================== -->

    <div class="pestanas">

        <button
            class="pestana activa"
            id="btnTodos"
            onclick="mostrarTodos()">

            🛍️ VER TODOS LOS PRODUCTOS

        </button>

    </div>


    <!-- =====================================================
         SEPARADOR
    ===================================================== -->

    <div class="separador">

        🕸️
        ESPECIAL HALLOWEEN
        🕸️

    </div>


    <!-- =====================================================
         GALERÍA
    ===================================================== -->

    <div
        class="galeria"
        id="galeria">

    </div>


    <!-- =====================================================
         VISOR
    ===================================================== -->

    <div
        class="visor"
        id="visor">

        <span
            class="cerrar"
            onclick="cerrarVisor()"
            aria-label="Cerrar">

            &times;

        </span>


        <button
            class="anterior"
            onclick="imagenAnterior()"
            aria-label="Imagen anterior">

            &#10094;

        </button>


        <img
            id="imagenGrande"
            src=""
            alt="Producto">


        <button
            class="siguiente"
            onclick="imagenSiguiente()"
            aria-label="Imagen siguiente">

            &#10095;

        </button>


        <div
            class="numero"
            id="numeroImagen">

            1 / 61

        </div>

    </div>


    <!-- =====================================================
         WHATSAPP
         Cambiá el número si querés utilizar otro.
    ===================================================== -->

    <a
        class="whatsapp"
        href="https://wa.me/543425953322"
        target="_blank"
        aria-label="Contactar por WhatsApp">

        💬

    </a>


    <!-- =====================================================
         PIE
    ===================================================== -->

    <footer>

        <span class="calabaza">
            🎃 👻 🕷️
        </span>

        <strong>
            MAM DISTRIBUCIONES
        </strong>

        <br>

        Catálogo especial Halloween

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           CONFIGURACIÓN
        ===================================================== */

        const TOTAL_IMAGENES = 61;


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const galeria =
            document.getElementById(
                "galeria"
            );


        const visor =
            document.getElementById(
                "visor"
            );


        const imagenGrande =
            document.getElementById(
                "imagenGrande"
            );


        const numeroImagen =
            document.getElementById(
                "numeroImagen"
            );


        const btnTodos =
            document.getElementById(
                "btnTodos"
            );


        /* =====================================================
           VARIABLES
        ===================================================== */

        let imagenActual = 1;


        /* =====================================================
           CREAR GALERÍA
        ===================================================== */

        function mostrarImagenes() {

            galeria.innerHTML = "";


            for (
                let i = 1;
                i <= TOTAL_IMAGENES;
                i++
            ) {

                const producto =
                    document.createElement(
                        "div"
                    );


                producto.className =
                    "producto";


                producto.dataset.numero =
                    i;


                producto.innerHTML = `

                    <img
                        src="${i}.png"
                        alt="Producto ${i}"
                        loading="lazy"
                    >

                    <div class="producto-info">

                        🎃 Producto ${i}

                    </div>

                `;


                /* =================================================
                   ABRIR VISOR
                ================================================= */

                producto.onclick =
                    function () {

                        abrirVisor(i);

                    };


                /* =================================================
                   IMAGEN NO EXISTE
                ================================================= */

                const imagen =
                    producto.querySelector(
                        "img"
                    );


                imagen.onerror =
                    function () {

                        producto.style.display =
                            "none";

                    };


                galeria.appendChild(
                    producto
                );

            }

        }


        /* =====================================================
           MOSTRAR TODOS
        ===================================================== */

        function mostrarTodos() {

            btnTodos.classList.add(
                "activa"
            );

            mostrarImagenes();

        }


        /* =====================================================
           ABRIR VISOR
        ===================================================== */

        function abrirVisor(numero) {

            imagenActual =
                numero;


            actualizarVisor();


            visor.style.display =
                "flex";


            document.body.style.overflow =
                "hidden";

        }


        /* =====================================================
           ACTUALIZAR VISOR
        ===================================================== */

        function actualizarVisor() {

            imagenGrande.src =
                imagenActual +
                ".png";


            imagenGrande.alt =
                "Producto " +
                imagenActual;


            numeroImagen.textContent =
                imagenActual +
                " / " +
                TOTAL_IMAGENES;

        }


        /* =====================================================
           CERRAR VISOR
        ===================================================== */

        function cerrarVisor() {

            visor.style.display =
                "none";


            document.body.style.overflow =
                "auto";

        }


        /* =====================================================
           IMAGEN ANTERIOR
        ===================================================== */

        function imagenAnterior() {

            imagenActual--;


            if (
                imagenActual < 1
            ) {

                imagenActual =
                    TOTAL_IMAGENES;

            }


            actualizarVisor();

        }


        /* =====================================================
           IMAGEN SIGUIENTE
        ===================================================== */

        function imagenSiguiente() {

            imagenActual++;


            if (
                imagenActual >
                TOTAL_IMAGENES
            ) {

                imagenActual =
                    1;

            }


            actualizarVisor();

        }


        /* =====================================================
           CERRAR AL HACER CLICK AFUERA
        ===================================================== */

        visor.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === visor
                ) {

                    cerrarVisor();

                }

            }
        );


        /* =====================================================
           TECLADO
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {


                /* ESC */

                if (
                    event.key === "Escape" &&
                    visor.style.display === "flex"
                ) {

                    cerrarVisor();

                }


                /* IZQUIERDA */

                if (
                    event.key === "ArrowLeft" &&
                    visor.style.display === "flex"
                ) {

                    imagenAnterior();

                }


                /* DERECHA */

                if (
                    event.key === "ArrowRight" &&
                    visor.style.display === "flex"
                ) {

                    imagenSiguiente();

                }

            }
        );


        /* =====================================================
           CARGAR GALERÍA
        ===================================================== */

        mostrarImagenes();

    </script>


</body>

</html>

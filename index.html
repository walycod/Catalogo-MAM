<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de productos</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            background: #d71920;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        /* =========================
           PESTAÑAS
        ========================= */

        .pestanas {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px 15px 10px;
            flex-wrap: wrap;
        }

        .pestana {
            border: none;
            padding: 13px 25px;
            border-radius: 30px;
            background: white;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.12);

            transition: 0.25s;
        }

        .pestana:hover {
            transform: translateY(-2px);
        }

        .pestana.activa {
            background: #d71920;
            color: white;
        }

        /* =========================
           BOTÓN OFERTAS
        ========================= */

        .pestana.ofertas {
            background:
                linear-gradient(
                    135deg,
                    #ffcc00,
                    #ff7b00
                );

            color: #8b0000;
            border: 2px solid white;

            animation: pulsar 1.5s infinite;
        }

        .pestana.ofertas.activa {
            background:
                linear-gradient(
                    135deg,
                    #ff0000,
                    #ff9800
                );

            color: white;
        }

        @keyframes pulsar {

            0% {
                transform: scale(1);

                box-shadow:
                    0 3px 10px
                    rgba(255, 140, 0, 0.3);
            }

            50% {
                transform: scale(1.05);

                box-shadow:
                    0 5px 25px
                    rgba(255, 80, 0, 0.65);
            }

            100% {
                transform: scale(1);

                box-shadow:
                    0 3px 10px
                    rgba(255, 140, 0, 0.3);
            }

        }

        /* =========================
           BUSCADOR
        ========================= */

        .buscador {
            max-width: 500px;
            margin: 15px auto 25px;
            padding: 0 15px;
        }

        .buscador input {
            width: 100%;
            padding: 14px 18px;

            border: 1px solid #ddd;
            border-radius: 30px;

            font-size: 16px;
            outline: none;
        }

        .buscador input:focus {
            border-color: #d71920;
        }

        /* =========================
           TITULO OFERTAS
        ========================= */

        .titulo-ofertas {
            display: none;

            max-width: 1200px;
            margin: 5px auto 20px;
            padding: 0 15px;

            text-align: center;
        }

        .titulo-ofertas h2 {
            display: inline-block;

            padding: 14px 25px;
            border-radius: 15px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff0000,
                    #ff9800
                );

            box-shadow:
                0 5px 25px
                rgba(255, 80, 0, 0.45);

            animation: brillo 2s infinite;
        }

        @keyframes brillo {

            0% {
                box-shadow:
                    0 5px 20px
                    rgba(255, 80, 0, 0.3);
            }

            50% {
                box-shadow:
                    0 5px 35px
                    rgba(255, 180, 0, 0.85);
            }

            100% {
                box-shadow:
                    0 5px 20px
                    rgba(255, 80, 0, 0.3);
            }

        }

        /* =========================
           GALERÍA
        ========================= */

        .galeria {
            max-width: 1200px;

            margin: 0 auto;

            padding:
                10px
                15px
                50px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        /* =========================
           PRODUCTO
        ========================= */

        .producto {
            position: relative;

            background: white;

            border-radius: 12px;

            overflow: hidden;

            cursor: pointer;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.10);

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }

        .producto:hover {
            transform:
                translateY(-5px);

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.18);
        }

        .producto img {
            width: 100%;

            height: 230px;

            display: block;

            object-fit: contain;

            padding: 10px;

            background: white;
        }

        /* =========================
           ETIQUETA OFERTA
        ========================= */

        .etiqueta-oferta {
            position: absolute;

            top: 12px;
            left: 12px;

            z-index: 2;

            background:
                linear-gradient(
                    135deg,
                    #ff0000,
                    #ff7200
                );

            color: white;

            padding: 8px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

            box-shadow:
                0 3px 8px
                rgba(0, 0, 0, 0.25);

            animation:
                oferta 1.3s infinite;
        }

        @keyframes oferta {

            0% {
                transform:
                    rotate(-3deg)
                    scale(1);
            }

            50% {
                transform:
                    rotate(3deg)
                    scale(1.08);
            }

            100% {
                transform:
                    rotate(-3deg)
                    scale(1);
            }

        }

        /* =========================
           INFORMACIÓN OFERTA
        ========================= */

        .info-producto {
            padding: 15px;
            text-align: center;
        }

        .nombre-producto {
            font-size: 20px;

            font-weight: bold;

            color: #333;

            margin-bottom: 13px;
        }

        .promociones {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .promocion {
            background:
                linear-gradient(
                    135deg,
                    #fff3cd,
                    #ffffff
                );

            border:
                2px solid #ff9800;

            border-radius: 10px;

            padding: 10px 7px;

            font-size: 15px;

            font-weight: bold;

            color: #d71920;

            box-shadow:
                0 2px 6px
                rgba(255, 120, 0, 0.15);
        }

        .promocion strong {
            color: #111;
        }

        .llamada-oferta {
            margin-top: 12px;

            color: #ff6500;

            font-size: 13px;

            font-weight: bold;
        }

        /* =========================
           VISOR GRANDE
        ========================= */

        .visor {
            display: none;

            position: fixed;

            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.92);

            align-items: center;
            justify-content: center;
        }

        .visor img {
            max-width: 90%;
            max-height: 90%;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 0 30px
                rgba(0, 0, 0, 0.5);
        }

        /* =========================
           CERRAR
        ========================= */

        .cerrar {
            position: absolute;

            top: 20px;
            right: 30px;

            color: white;

            font-size: 45px;

            font-weight: bold;

            cursor: pointer;

            z-index: 10001;
        }

        .cerrar:hover {
            color: #ff4444;
        }

        /* =========================
           ANTERIOR / SIGUIENTE
        ========================= */

        .anterior,
        .siguiente {
            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background:
                rgba(255, 255, 255, 0.2);

            color: white;

            width: 55px;
            height: 70px;

            font-size: 35px;

            cursor: pointer;

            border-radius: 8px;

            transition:
                background 0.2s;
        }

        .anterior:hover,
        .siguiente:hover {
            background:
                rgba(255, 255, 255, 0.4);
        }

        .anterior {
            left: 20px;
        }

        .siguiente {
            right: 20px;
        }

        /* =========================
           NUMERO
        ========================= */

        .numero {
            position: absolute;

            bottom: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            color: white;

            background:
                rgba(0, 0, 0, 0.5);

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 15px;
        }

        /* =========================
           SIN RESULTADOS
        ========================= */

        .sin-resultados {
            grid-column: 1 / -1;

            text-align: center;

            padding: 50px;

            color: #777;

            font-size: 18px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .galeria {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            header h1 {
                font-size: 26px;
            }

            .pestana {
                padding: 11px 17px;
                font-size: 14px;
            }

            .galeria {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .producto img {
                height: 180px;
            }

            .nombre-producto {
                font-size: 17px;
            }

            .promocion {
                font-size: 13px;
            }

            .anterior,
            .siguiente {
                width: 45px;
                height: 60px;
                font-size: 28px;
            }

            .anterior {
                left: 8px;
            }

            .siguiente {
                right: 8px;
            }

        }

        @media (max-width: 400px) {

            .producto img {
                height: 150px;
            }

            .pestanas {
                gap: 7px;
            }

            .pestana {
                padding: 10px 12px;
                font-size: 13px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         ENCABEZADO
    ========================= -->

    <header>

        <h1>
            CATÁLOGO
        </h1>

        <p>
            Todos nuestros productos
        </p>

    </header>


    <!-- =========================
         PESTAÑAS
    ========================= -->

    <div class="pestanas">

        <button
            class="pestana activa"
            id="btnTodos"
            onclick="mostrarTodos()">

            🛍️ TODOS

        </button>

        <button
            class="pestana ofertas"
            id="btnOfertas"
            onclick="mostrarOfertas()">

            🔥 OFERTAS DEL DÍA 🔥

        </button>

    </div>


    <!-- =========================
         BUSCADOR
    ========================= -->

    <div class="buscador">

        <input
            type="text"
            id="buscar"
            placeholder="Buscar producto por número..."
            oninput="buscar()">

    </div>


    <!-- =========================
         TITULO OFERTAS
    ========================= -->

    <div
        class="titulo-ofertas"
        id="tituloOfertas">

        <h2>
            🔥 ¡OFERTAS DEL DÍA! 🔥
        </h2>

    </div>


    <!-- =========================
         GALERÍA
    ========================= -->

    <div
        class="galeria"
        id="galeria">
    </div>


    <!-- =========================
         VISOR
    ========================= -->

    <div
        class="visor"
        id="visor">

        <span
            class="cerrar"
            onclick="cerrarVisor()"
            aria-label="Cerrar">

            &times;

        </span>

        <button
            class="anterior"
            onclick="imagenAnterior()"
            aria-label="Imagen anterior">

            &#10094;

        </button>

        <img
            id="imagenGrande"
            src=""
            alt="Producto">

        <button
            class="siguiente"
            onclick="imagenSiguiente()"
            aria-label="Imagen siguiente">

            &#10095;

        </button>

        <div
            class="numero"
            id="numeroImagen">

            1 / 55

        </div>

    </div>


    <script>

        /* =========================
           CONFIGURACIÓN
        ========================= */

        const TOTAL_IMAGENES = 55;


        /* =========================
           OFERTAS
        ========================= */

        const OFERTAS = {

            /* =====================
               OFERTA IMAGEN 45
            ===================== */

            45: {

                nombre:
                    "Masitas Diversión",

                promociones: [

                    {
                        cantidad: 7,
                        descuento: "5% OFF"
                    },

                    {
                        cantidad: 14,
                        descuento: "8% OFF"
                    },

                    {
                        cantidad: 21,
                        descuento: "15% OFF"
                    }

                ]

            },


            /* =====================
               OFERTA IMAGEN 37
            ===================== */

            37: {

                nombre:
                    "ALF -- BAGLEY -- ARCOR -- AGUILA",

                promociones: [

                    {
                        cantidad: 6,
                        descuento:
                            "1 ALF Rasta Triple sin cargo"
                    }

                ]

            },


            /* =====================
               OFERTA IMAGEN 29
            ===================== */

            29: {

                nombre:
                    "ALF -- Rasta Triple",

                promociones: [

                    {
                        cantidad: 7,
                        descuento:
                            "1 sin cargo"
                    }

                ]

            }

        };


        /* =========================
           ELEMENTOS
        ========================= */

        const galeria =
            document.getElementById(
                "galeria"
            );

        const visor =
            document.getElementById(
                "visor"
            );

        const imagenGrande =
            document.getElementById(
                "imagenGrande"
            );

        const numeroImagen =
            document.getElementById(
                "numeroImagen"
            );

        const buscador =
            document.getElementById(
                "buscar"
            );

        const tituloOfertas =
            document.getElementById(
                "tituloOfertas"
            );

        const btnTodos =
            document.getElementById(
                "btnTodos"
            );

        const btnOfertas =
            document.getElementById(
                "btnOfertas"
            );


        /* =========================
           VARIABLES
        ========================= */

        let imagenActual = 1;

        let modoOfertas = false;


        /* =========================
           CREAR GALERÍA
        ========================= */

        function mostrarImagenes() {

            galeria.innerHTML = "";

            for (
                let i = 1;
                i <= TOTAL_IMAGENES;
                i++
            ) {

                const producto =
                    document.createElement(
                        "div"
                    );

                producto.className =
                    "producto";

                producto.dataset.numero =
                    i;

                const oferta =
                    OFERTAS[i];

                let contenido = `

                    <img
                        src="${i}.png"
                        alt="Producto ${i}"
                        loading="lazy"
                    >

                `;


                /* =========================
                   SI ES OFERTA
                ========================= */

                if (oferta) {

                    let promocionesHTML =
                        "";

                    oferta.promociones.forEach(
                        promocion => {

                            promocionesHTML += `

                                <div
                                    class="promocion">

                                    🔥 Llevando

                                    <strong>
                                        ${promocion.cantidad}
                                    </strong>

                                    →

                                    <strong>
                                        ${promocion.descuento}
                                    </strong>

                                </div>

                            `;

                        }
                    );


                    contenido += `

                        <div
                            class="etiqueta-oferta">

                            🔥 OFERTA

                        </div>


                        <div
                            class="info-producto">

                            <div
                                class="nombre-producto">

                                ${oferta.nombre}

                            </div>


                            <div
                                class="promociones">

                                ${promocionesHTML}

                            </div>


                            <div
                                class="llamada-oferta">

                                💥 ¡Aprovechá esta promoción!

                            </div>

                        </div>

                    `;

                }


                producto.innerHTML =
                    contenido;


                /* =========================
                   ABRIR VISOR
                ========================= */

                producto.onclick =
                    function() {

                        abrirVisor(i);

                    };


                /* =========================
                   IMAGEN NO EXISTE
                ========================= */

                const imagen =
                    producto.querySelector(
                        "img"
                    );

                imagen.onerror =
                    function() {

                        producto.style.display =
                            "none";

                    };


                galeria.appendChild(
                    producto
                );

            }

        }


        /* =========================
           MOSTRAR TODOS
        ========================= */

        function mostrarTodos() {

            modoOfertas = false;

            buscador.value = "";

            tituloOfertas.style.display =
                "none";

            btnTodos.classList.add(
                "activa"
            );

            btnOfertas.classList.remove(
                "activa"
            );

            mostrarImagenes();

        }


        /* =========================
           MOSTRAR OFERTAS
        ========================= */

        function mostrarOfertas() {

            modoOfertas = true;

            buscador.value = "";

            tituloOfertas.style.display =
                "block";

            btnTodos.classList.remove(
                "activa"
            );

            btnOfertas.classList.add(
                "activa"
            );

            mostrarImagenes();

            const productos =
                document.querySelectorAll(
                    ".producto"
                );

            productos.forEach(
                producto => {

                    const numero =
                        producto.dataset.numero;

                    if (
                        !OFERTAS[numero]
                    ) {

                        producto.style.display =
                            "none";

                    }

                }
            );

        }


        /* =========================
           BUSCADOR
        ========================= */

        function buscar() {

            const texto =
                buscador.value
                    .toLowerCase()
                    .trim();

            const productos =
                document.querySelectorAll(
                    ".producto"
                );

            let encontrados = 0;


            productos.forEach(
                producto => {

                    const numero =
                        producto.dataset.numero;


                    /* En ofertas solo
                       mostramos ofertas */

                    if (
                        modoOfertas &&
                        !OFERTAS[numero]
                    ) {

                        producto.style.display =
                            "none";

                        return;

                    }


                    /* Buscar por número */

                    if (
                        numero.includes(texto)
                    ) {

                        producto.style.display =
                            "block";

                        encontrados++;

                    } else {

                        producto.style.display =
                            "none";

                    }

                }
            );


            /* =========================
               MENSAJE SIN RESULTADOS
            ========================= */

            let mensaje =
                document.getElementById(
                    "sinResultados"
                );


            if (
                texto !== "" &&
                encontrados === 0
            ) {

                if (!mensaje) {

                    mensaje =
                        document.createElement(
                            "div"
                        );

                    mensaje.id =
                        "sinResultados";

                    mensaje.className =
                        "sin-resultados";

                    mensaje.textContent =
                        "No se encontró ningún producto.";

                    galeria.appendChild(
                        mensaje
                    );

                }

            } else {

                if (mensaje) {

                    mensaje.remove();

                }

            }

        }


        /* =========================
           ABRIR VISOR
        ========================= */

        function abrirVisor(numero) {

            imagenActual =
                numero;

            actualizarVisor();

            visor.style.display =
                "flex";

            document.body.style.overflow =
                "hidden";

        }


        /* =========================
           ACTUALIZAR VISOR
        ========================= */

        function actualizarVisor() {

            imagenGrande.src =
                imagenActual +
                ".png";

            imagenGrande.alt =
                "Producto " +
                imagenActual;

            numeroImagen.textContent =
                imagenActual +
                " / " +
                TOTAL_IMAGENES;

        }


        /* =========================
           CERRAR VISOR
        ========================= */

        function cerrarVisor() {

            visor.style.display =
                "none";

            document.body.style.overflow =
                "auto";

        }


        /* =========================
           IMAGEN ANTERIOR
        ========================= */

        function imagenAnterior() {

            imagenActual--;

            if (
                imagenActual < 1
            ) {

                imagenActual =
                    TOTAL_IMAGENES;

            }

            actualizarVisor();

        }


        /* =========================
           IMAGEN SIGUIENTE
        ========================= */

        function imagenSiguiente() {

            imagenActual++;

            if (
                imagenActual >
                TOTAL_IMAGENES
            ) {

                imagenActual =
                    1;

            }

            actualizarVisor();

        }


        /* =========================
           CERRAR AL HACER CLICK AFUERA
        ========================= */

        visor.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === visor
                ) {

                    cerrarVisor();

                }

            }
        );


        /* =========================
           TECLADO
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                /* ESC */

                if (
                    event.key === "Escape" &&
                    visor.style.display === "flex"
                ) {

                    cerrarVisor();

                }


                /* IZQUIERDA */

                if (
                    event.key === "ArrowLeft" &&
                    visor.style.display === "flex"
                ) {

                    imagenAnterior();

                }


                /* DERECHA */

                if (
                    event.key === "ArrowRight" &&
                    visor.style.display === "flex"
                ) {

                    imagenSiguiente();

                }

            }
        );


        /* =========================
           CARGAR GALERÍA
        ========================= */

        mostrarImagenes();

    </script>

</body>

</html>

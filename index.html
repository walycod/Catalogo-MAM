
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de productos</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

header {
    background: #d71920;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.pestanas {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 15px;
    flex-wrap: wrap;
}

.pestana {
    border: none;
    padding: 13px 25px;
    border-radius: 30px;
    background: white;
    color: #333;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px #0002;
}

.pestana.activa {
    background: #d71920;
    color: white;
}

.pestana.oferta {
    background: #222;
    color: white;
}

.pestana.oferta.activa {
    background: #ff9d00;
    color: #222;
}

.galeria {
    max-width: 1200px;
    margin: auto;
    padding: 10px 15px 50px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.producto {
    position: relative;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 3px 10px #0002;
    transition: .25s;
}

.producto:hover {
    transform: translateY(-5px);
}

.producto img {
    width: 100%;
    height: 230px;
    object-fit: contain;
    padding: 10px;
}

.nombre-producto {
    text-align: center;
    padding: 12px;
    font-weight: bold;
}

.etiqueta {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #d71920;
    color: white;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    z-index: 2;
}

.etiqueta.verde {
    background: #168b43;
}

.sin-resultados {
    grid-column: 1/-1;
    text-align: center;
    padding: 50px;
    color: #777;
}

.visor {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: #000e;
    align-items: center;
    justify-content: center;
}

.visor img {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
    border-radius: 8px;
}

.cerrar {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 45px;
    cursor: pointer;
}

.anterior, .siguiente {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: #ffffff33;
    color: white;
    width: 55px;
    height: 70px;
    font-size: 35px;
    cursor: pointer;
    border-radius: 8px;
}

.anterior { left: 20px; }
.siguiente { right: 20px; }

.numero {
    position: absolute;
    bottom: 20px;
    color: white;
    background: #0008;
    padding: 8px 15px;
    border-radius: 20px;
}

@media(max-width:900px) {
    .galeria { grid-template-columns: repeat(3,1fr); }
}

@media(max-width:650px) {
    header h1 { font-size: 26px; }

    .galeria {
        grid-template-columns: repeat(2,1fr);
        gap: 12px;
    }

    .producto img { height: 180px; }

    .anterior, .siguiente {
        width: 45px;
        height: 60px;
        font-size: 28px;
    }

    .anterior { left: 8px; }
    .siguiente { right: 8px; }
}

@media(max-width:400px) {
    .producto img { height: 150px; }
    .pestana { padding: 10px 12px; font-size: 13px; }
}
    .boton-whatsapp {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #25D366;
    color: white;
    padding: 15px 22px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 4px 15px #0003;
    z-index: 99999;
    transition: .3s;
}

.boton-whatsapp:hover {
    background: #128C7E;
    transform: scale(1.05);
}
    .encabezado-mam {
    width: 100%;
    padding: 0;
    background: #d71920;
    overflow: hidden;
}

.encabezado-mam img {
    display: block;
    width: 100%;
    height: 230px;
    object-fit: cover;
    object-position: center;
}

@media(max-width: 650px) {
    .encabezado-mam img {
        min-height: 180px;
        object-fit: cover;
    }
}

</style>
</head>

<body>
<a class="boton-whatsapp"
href="https://wa.me/5493425953322?text=Hola%20MAM,%20quisiera%20consultar%20por%20sus%20productos."
target="_blank">
💬 Consultar por WhatsApp
</a>
   <header class="encabezado-mam">
    <img src="encabezado-mam.png" alt="MAM Miguel Angel Montú Distribuciones">
</header>


<div class="pestanas">

    <button class="pestana activa" id="btnTodos"
    onclick="mostrarTodos()">
        🛍️ TODOS
    </button>

    <button class="pestana oferta" id="btnOferta"
    onclick="mostrarOfertas()">
        🔥 OFERTA DEL DÍA
    </button>

</div>

<div class="galeria" id="galeria"></div>

<div class="visor" id="visor">

    <span class="cerrar" onclick="cerrarVisor()">
        &times;
    </span>

    <button class="anterior" onclick="cambiar(-1)">
        &#10094;
    </button>

    <img id="imagenGrande" src="" alt="Producto">

    <button class="siguiente" onclick="cambiar(1)">
        &#10095;
    </button>

    <div class="numero" id="numeroImagen"></div>

</div>

<script>

const TOTAL_IMAGENES = 66;

const ofertas = [
    {
        numero: 62,
        imagen: "62.png",
        nombre: "ALF RASTA BLANCO",
        descuento: "10% OFF"
    },
    {
        numero: 66,
        imagen: "66.png",
        nombre: "TIC TAC MENTA FUERTE",
        descuento: "OFERTA DEL DÍA"
    }
];

const galeria = document.getElementById("galeria");
const visor = document.getElementById("visor");
const imagenGrande = document.getElementById("imagenGrande");
const numeroImagen = document.getElementById("numeroImagen");

let productosVisibles = [];
let imagenActual = 0;

function mostrarTodos() {

    activarBoton("btnTodos");

    galeria.innerHTML = "";
    productosVisibles = [];

    for(let i = 1; i <= TOTAL_IMAGENES; i++) {

        agregarProducto({
            imagen: i + ".png",
            nombre: "Producto " + i,
            numero: i
        });
    }
}

function mostrarOfertas() {

    activarBoton("btnOferta");

    galeria.innerHTML = "";
    productosVisibles = [];

    ofertas.forEach(producto => {
        agregarProducto(producto);
    });
}

function activarBoton(id) {

    document.querySelectorAll(".pestana")
        .forEach(b => b.classList.remove("activa"));

    document.getElementById(id)
        .classList.add("activa");
}

function agregarProducto(datos) {

    const producto = document.createElement("div");
    producto.className = "producto";

    const img = document.createElement("img");
    img.src = datos.imagen;
    img.alt = datos.nombre;
    img.loading = "lazy";

    const nombre = document.createElement("div");
    nombre.className = "nombre-producto";
    nombre.textContent = datos.nombre;

    if(datos.descuento) {

        const etiqueta = document.createElement("div");
        etiqueta.className = "etiqueta";
        etiqueta.textContent = datos.descuento;

        if(datos.descuento === "OFERTA DEL DÍA") {
            etiqueta.classList.add("verde");
        }

        producto.appendChild(etiqueta);
    }

    img.onerror = () => {
        producto.remove();
    };

    producto.appendChild(img);
    producto.appendChild(nombre);

    producto.onclick = () => abrirVisor(datos.imagen);

    galeria.appendChild(producto);

    productosVisibles.push(datos.imagen);
}

function abrirVisor(imagen) {

    imagenActual = productosVisibles.indexOf(imagen);

    actualizarVisor();

    visor.style.display = "flex";
    document.body.style.overflow = "hidden";
}

function actualizarVisor() {

    imagenGrande.src = productosVisibles[imagenActual];

    numeroImagen.textContent =
        (imagenActual + 1) + " / " + productosVisibles.length;
}

function cerrarVisor() {

    visor.style.display = "none";
    document.body.style.overflow = "auto";
}

function cambiar(direccion) {

    imagenActual += direccion;

    if(imagenActual < 0) {
        imagenActual = productosVisibles.length - 1;
    }

    if(imagenActual >= productosVisibles.length) {
        imagenActual = 0;
    }

    actualizarVisor();
}

visor.addEventListener("click", e => {
    if(e.target === visor) cerrarVisor();
});

document.addEventListener("keydown", e => {

    if(visor.style.display !== "flex") return;

    if(e.key === "Escape") cerrarVisor();
    if(e.key === "ArrowLeft") cambiar(-1);
    if(e.key === "ArrowRight") cambiar(1);

});

mostrarTodos();

</script>

</body>
</html>
